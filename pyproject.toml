[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "HOTFIXR"
version = "0.1.0"
description = "Python orchestration API for the HOTFIXR training pipeline"
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
